<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART SACCOS Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(31, 168, 230, 0.18), transparent 36%),
          linear-gradient(180deg, #f8fafc, #eef4ff);
      }

      .panel {
        width: min(560px, 100%);
        padding: 28px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(10, 5, 115, 0.12);
        box-shadow: 0 20px 44px rgba(15, 23, 42, 0.12);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }

      .brand img {
        width: 54px;
        height: 54px;
        border-radius: 14px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #0a0573;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.78rem;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.9rem, 4vw, 2.7rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 16px;
        color: #475569;
        font-size: 1rem;
        line-height: 1.65;
      }

      .notice {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(31, 168, 230, 0.08);
        border: 1px solid rgba(31, 168, 230, 0.16);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
      }

      button {
        border: none;
        background: #0a0573;
        color: #fff;
      }

      a {
        border: 1px solid rgba(10, 5, 115, 0.14);
        color: #0a0573;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <img src="/SACCOSS-LOGO.png" alt="SMART SACCOS logo" />
        <div>
          <div class="eyebrow">Offline mode</div>
          <strong>SMART SACCOS</strong>
        </div>
      </div>
      <h1>You are offline.</h1>
      <p>The app shell is available, but live member records, approvals, balances, and payment actions still need an internet connection.</p>
      <div class="notice">
        <p>Reconnect and reload when you are ready to continue with operational or financial tasks.</p>
      </div>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Return to home</a>
      </div>
    </main>
  </body>
</html>
