server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text assets over the wire. This is the main fix for slow loads -
    # it turns the JS/CSS bundles from megabytes into a few hundred KB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (index-<hash>.js) never change - cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entry, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
